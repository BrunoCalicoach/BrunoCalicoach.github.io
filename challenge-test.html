<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">

<script>
// Runs before the page draws, so dark mode does not flash white first
(function () {
  let saved = null;
  try { saved = localStorage.getItem('challengeTheme'); } catch (error) { /* Storage can be blocked */ }
  const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>

<title>Challenge Test | Bruno Zgela Coaching</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="challenge-test-rules.js?v=17"></script>

<style>

body{
  font-family:'Inter',sans-serif;
  background:#f5f5f5;
  color:#111827;
}

.hero{
  background:
    linear-gradient(to bottom,rgba(0,0,0,0.78),rgba(0,0,0,0.92)),
    url('folder/img1.jpeg');
  background-size:cover;
  background-position:center;
}

.btn-primary{
  background:#ef4444;
  color:#ffffff;
  font-weight:600;
  min-height:52px;
  padding:12px 22px;
  border-radius:12px;
  transition:.25s ease;
}

.btn-primary:hover{
  background:#dc2626;
}

.btn-outline{
  border:1px solid #d1d5db;
  background:#ffffff;
  font-weight:500;
  min-height:52px;
  padding:12px 18px;
  border-radius:12px;
}

.btn-outline:hover{
  background:#f3f4f6;
}

.btn-secondary{
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.05);
  transition:.25s ease;
}

.btn-secondary:hover{
  background:rgba(255,255,255,0.12);
}

.card{
  background:#ffffff;
  border-radius:18px;
  border:1px solid #ececec;
  padding:20px;
  min-width:0;
}

.card-flush{
  padding:0;
  overflow:hidden;
}

/* Keeps the wide plan table scrolling inside its card */
#test-app .grid{
  grid-template-columns:minmax(0,1fr);
}

.tools-summary{
  min-height:44px;
  display:flex;
  align-items:center;
  font-weight:600;
  cursor:pointer;
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.scenario-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}

.scenario{
  text-align:left;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:14px;
  background:#ffffff;
}

.scenario:hover,.scenario.active{
  border-color:#ef4444;
}

.scenario.active{
  box-shadow:inset 0 0 0 1px #ef4444;
}

.checkin-label{
  font-size:14px;
  font-weight:500;
  margin-bottom:8px;
}

.checkin-row{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:8px;
}

.checkin-button{
  min-height:48px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#ffffff;
  font-size:17px;
  font-weight:600;
}

.checkin-button.active{
  background:#111827;
  border-color:#111827;
  color:#ffffff;
}

.day-tabs{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  scroll-margin-top:8px;
}

.day-tab{
  min-height:52px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#ffffff;
  font-weight:600;
}

.day-tab.active{
  background:#111827;
  border-color:#111827;
  color:#ffffff;
}

.action-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}

.message{
  background:#fef2f2;
  border:1px solid #fecaca;
  border-radius:12px;
  padding:12px 16px;
}

.tab-row{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}

.tab{
  min-height:52px;
  padding:8px 6px;
  border:1px solid #e5e7eb;
  border-radius:12px;
  background:#ffffff;
  font-weight:600;
}

.tab.active{
  background:#ef4444;
  border-color:#ef4444;
  color:#ffffff;
}

.exercise-list{
  display:grid;
  gap:12px;
}

.exercise{
  background:#e5e7eb;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:14px;
}

.exercise-head{
  text-align:center;
  padding-bottom:12px;
  border-bottom:1px solid #c4c9d1;
}

.exercise-title{
  font-size:19px;
  line-height:1.3;
  font-weight:700;
  color:#111827;
}

.target{
  font-size:18px;
  line-height:1.35;
  color:#b91c1c;
  font-weight:700;
}

.exercise-info{
  font-size:15px;
  line-height:1.4;
  color:#1f2937;
  font-weight:500;
}

.tag{
  font-size:12px;
  font-weight:600;
  border-radius:999px;
  padding:2px 10px;
}

.tag-lighter{
  background:#ede9fe;
  color:#5b21b6;
}

.tag-rebuilt{
  background:#dbeafe;
  color:#1e40af;
}

.set-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
  gap:12px;
}

.set-label{
  display:block;
  font-size:13px;
  color:#374151;
  margin-bottom:4px;
}

.stepper{
  display:grid;
  grid-template-columns:44px minmax(0,1fr) 44px;
  gap:4px;
}

.step{
  height:48px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#ffffff;
  font-size:22px;
  font-weight:600;
  line-height:1;
  touch-action:manipulation;
}

.step:active{
  background:#e5e7eb;
}

.set-input{
  width:100%;
  min-width:0;
  height:48px;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:0;
  text-align:center;
  color:#111827;
  font-size:17px;
  font-weight:600;
  -moz-appearance:textfield;
}

.set-input::-webkit-outer-spin-button,.set-input::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}

.easy-row{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:52px;
  padding:8px 14px;
  background:#ffffff;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-weight:500;
  cursor:pointer;
}

.easy-row:has(input:checked){
  border-color:#ef4444;
  background:#fef2f2;
}

.easy-box{
  width:24px;
  height:24px;
  flex:none;
  accent-color:#ef4444;
}

.set-input:focus,.step:focus-visible,.checkin-button:focus-visible,.day-tab:focus-visible,.tab:focus-visible,.scenario:focus-visible,.btn-primary:focus-visible,.btn-outline:focus-visible{
  outline:none;
  box-shadow:0 0 0 2px #ef4444;
}

@media (max-width:480px){
  .card{
    padding:14px;
  }

  .card-flush{
    padding:0;
  }

  .exercise{
    padding:12px;
  }

  .exercise-name{
    min-width:96px;
    max-width:110px;
  }
}

.table-wrap{
  overflow-x:auto;
  margin-top:12px;
}

.plan-table{
  border-collapse:collapse;
  font-size:12px;
  font-variant-numeric:tabular-nums;
}

.plan-table th,.plan-table td{
  border-top:1px solid #ececec;
  padding:8px;
  text-align:left;
  vertical-align:top;
}

.plan-table thead th{
  background:#f9fafb;
  white-space:nowrap;
}

.plan-table thead th.done-week{
  background:#111827;
  color:#ffffff;
}

.exercise-name{
  position:sticky;
  left:0;
  background:#ffffff;
  min-width:130px;
  max-width:150px;
  font-weight:600;
  z-index:1;
}

.plan-table thead .exercise-name{
  background:#f9fafb;
}

.day-row th{
  background:#f3f4f6;
  font-weight:700;
}

.day-label{
  position:sticky;
  left:8px;
}

.cell{
  min-width:92px;
}

.planned{
  color:#6b7280;
  font-size:10px;
  margin-top:2px;
}

.status-hit{
  background:#ecfdf5;
}

.status-close{
  background:#fef3c7;
}

.status-big{
  background:#fee2e2;
}

.status-low{
  background:#ede9fe;
}

.changed{
  box-shadow:inset 0 0 0 2px #2563eb;
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px 16px;
}

.legend span{
  display:inline-flex;
  align-items:center;
  gap:6px;
}

.swatch{
  width:14px;
  height:14px;
  border-radius:4px;
  border:1px solid #e5e7eb;
  display:inline-block;
}

.why{
  border-left:4px solid #d1d5db;
  padding:4px 0 4px 12px;
}

.status-border-close{
  border-color:#f59e0b;
}

.status-border-big{
  border-color:#ef4444;
}

.status-border-low{
  border-color:#8b5cf6;
}

.status-border-hit{
  border-color:#10b981;
}

.theme-toggle{
  min-height:44px;
  padding:8px 16px;
  border-radius:12px;
  font-weight:500;
  white-space:nowrap;
}

/* Dark mode */
html[data-theme="dark"]{
  color-scheme:dark;
}

html[data-theme="dark"] body{
  background:#111318;
  color:#f3f4f6;
}

html[data-theme="dark"] .card{
  background:#1c1f26;
  border-color:#2d323c;
}

html[data-theme="dark"] .exercise{
  background:#2b2f38;
  border-color:#3d434f;
}

html[data-theme="dark"] .exercise-head{
  border-bottom-color:#4b5563;
}

html[data-theme="dark"] .exercise-title{
  color:#f9fafb;
}

html[data-theme="dark"] .target{
  color:#fca5a5;
}

html[data-theme="dark"] .exercise-info{
  color:#e5e7eb;
}

html[data-theme="dark"] .set-label,
html[data-theme="dark"] .text-gray-500,
html[data-theme="dark"] .text-gray-600,
html[data-theme="dark"] .text-gray-700{
  color:#d1d5db;
}

html[data-theme="dark"] .step,
html[data-theme="dark"] .set-input,
html[data-theme="dark"] .easy-row,
html[data-theme="dark"] .checkin-button,
html[data-theme="dark"] .day-tab,
html[data-theme="dark"] .tab,
html[data-theme="dark"] .scenario,
html[data-theme="dark"] .btn-outline{
  background:#1c1f26;
  border-color:#4b5563;
  color:#f3f4f6;
}

html[data-theme="dark"] .step:active,
html[data-theme="dark"] .btn-outline:hover{
  background:#3d434f;
}

html[data-theme="dark"] .checkin-button.active,
html[data-theme="dark"] .day-tab.active{
  background:#f3f4f6;
  border-color:#f3f4f6;
  color:#111827;
}

html[data-theme="dark"] .tab.active{
  background:#ef4444;
  border-color:#ef4444;
  color:#ffffff;
}

html[data-theme="dark"] .scenario:hover,
html[data-theme="dark"] .scenario.active{
  border-color:#ef4444;
}

html[data-theme="dark"] .easy-row:has(input:checked),
html[data-theme="dark"] .message{
  background:#3b1518;
  border-color:#ef4444;
}

html[data-theme="dark"] .tag-lighter{
  background:#4c1d95;
  color:#ede9fe;
}

html[data-theme="dark"] .tag-rebuilt{
  background:#1e3a8a;
  color:#dbeafe;
}

html[data-theme="dark"] .plan-table th,
html[data-theme="dark"] .plan-table td{
  border-color:#2d323c;
}

html[data-theme="dark"] .exercise-name{
  background:#1c1f26;
}

html[data-theme="dark"] .plan-table thead th,
html[data-theme="dark"] .plan-table thead .exercise-name,
html[data-theme="dark"] .day-row th{
  background:#262a33;
}

html[data-theme="dark"] .plan-table thead th.done-week{
  background:#4b5563;
  color:#ffffff;
}

html[data-theme="dark"] .planned{
  color:#a3acb9;
}

html[data-theme="dark"] .status-hit{
  background:#12392c;
}

html[data-theme="dark"] .status-close{
  background:#453208;
}

html[data-theme="dark"] .status-big{
  background:#4a1c1c;
}

html[data-theme="dark"] .status-low{
  background:#2e2557;
}

html[data-theme="dark"] .changed{
  box-shadow:inset 0 0 0 2px #60a5fa;
}

html[data-theme="dark"] .swatch{
  border-color:#4b5563;
}

html[data-theme="dark"] .why{
  border-left-color:#4b5563;
}

html[data-theme="dark"] .status-border-close{
  border-left-color:#f59e0b;
}

html[data-theme="dark"] .status-border-big{
  border-left-color:#ef4444;
}

html[data-theme="dark"] .status-border-low{
  border-left-color:#8b5cf6;
}

html[data-theme="dark"] .status-border-hit{
  border-left-color:#10b981;
}

</style>
</head>

<body>

<section class="hero text-white">

  <nav class="max-w-7xl mx-auto px-5 py-6 flex justify-between items-center gap-4">

    <a href="index.html" class="font-extrabold tracking-wide">
      BRUNO ZGELA COACHING
    </a>

    <button id="theme-toggle" type="button" class="theme-toggle btn-secondary">Dark mode</button>

  </nav>

  <div class="max-w-5xl mx-auto px-4 sm:px-5 pt-0 sm:pt-4 pb-6 sm:pb-10">

    <span class="text-red-400 font-semibold">TEST PAGE</span>

    <h1 class="text-3xl sm:text-5xl font-extrabold mt-2 sm:mt-3">Adaptive progression test</h1>

    <p class="text-gray-300 mt-3 sm:mt-4 max-w-2xl">
      Log a week, miss some targets, and watch the rest of the 12 weeks change.
      This is only saved in this browser and does not touch member accounts.
    </p>

  </div>

</section>

<main id="test-app" class="max-w-5xl mx-auto px-4 sm:px-5 py-5 sm:py-8" aria-live="polite">
  <p class="text-gray-500 text-center">Loading...</p>
</main>

<script src="challenge-test.js?v=15"></script>

</body>
</html>
