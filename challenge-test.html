<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">

<title>Challenge Test | Bruno Zgela Coaching</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="challenge-test-rules.js?v=4"></script>

<style>

body{
  font-family:'Inter',sans-serif;
  background:#f5f5f5;
  color:#111827;
}

.hero{
  background:
    linear-gradient(to bottom,rgba(0,0,0,0.78),rgba(0,0,0,0.92)),
    url('folder/img1.jpeg');
  background-size:cover;
  background-position:center;
}

.btn-primary{
  background:#ef4444;
  color:#ffffff;
  font-weight:600;
  padding:12px 22px;
  border-radius:12px;
  transition:.25s ease;
}

.btn-primary:hover{
  background:#dc2626;
}

.btn-outline{
  border:1px solid #d1d5db;
  background:#ffffff;
  font-weight:500;
  padding:12px 18px;
  border-radius:12px;
}

.btn-outline:hover{
  background:#f3f4f6;
}

.btn-secondary{
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.05);
  transition:.25s ease;
}

.btn-secondary:hover{
  background:rgba(255,255,255,0.12);
}

.card{
  background:#ffffff;
  border-radius:18px;
  border:1px solid #ececec;
  padding:20px;
  min-width:0;
}

.card-flush{
  padding:0;
  overflow:hidden;
}

/* Keeps the wide plan table scrolling inside its card */
#test-app .grid{
  grid-template-columns:minmax(0,1fr);
}

.field-select{
  width:100%;
  max-width:100%;
  font-weight:400;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
  background:#ffffff;
}

.checkin{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:8px 10px;
  background:#ffffff;
}

.scenario-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:10px;
}

.scenario{
  text-align:left;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
  background:#ffffff;
}

.scenario:hover{
  border-color:#ef4444;
}

.message{
  background:#fef2f2;
  border:1px solid #fecaca;
  border-radius:12px;
  padding:12px 16px;
}

.tab-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.tab{
  padding:10px 16px;
  border:1px solid #e5e7eb;
  border-radius:12px;
  background:#ffffff;
  font-weight:600;
}

.tab.active{
  background:#ef4444;
  border-color:#ef4444;
  color:#ffffff;
}

.exercise-list{
  display:grid;
  gap:12px;
}

.exercise{
  border:1px solid #ececec;
  border-radius:12px;
  padding:14px;
}

.exercise-unchanged{
  background:#fafafa;
}

.target{
  color:#dc2626;
  font-weight:600;
}

.tag{
  font-size:12px;
  font-weight:600;
  border-radius:999px;
  padding:2px 10px;
}

.tag-lighter{
  background:#ede9fe;
  color:#5b21b6;
}

.tag-rebuilt{
  background:#dbeafe;
  color:#1e40af;
}

.quick{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:7px 12px;
  font-size:14px;
  background:#ffffff;
}

.quick.active{
  background:#111827;
  border-color:#111827;
  color:#ffffff;
}

.set-label{
  font-size:11px;
  color:#6b7280;
  display:flex;
  flex-direction:column;
  gap:3px;
  width:58px;
}

.set-input{
  width:100%;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:8px 4px;
  text-align:center;
  color:#111827;
  font-size:15px;
}

.set-input:focus,.quick:focus-visible,.tab:focus-visible,.scenario:focus-visible,.btn-primary:focus-visible,.btn-outline:focus-visible{
  outline:none;
  box-shadow:0 0 0 2px #ef4444;
}

.table-wrap{
  overflow-x:auto;
  margin-top:12px;
}

.plan-table{
  border-collapse:collapse;
  font-size:12px;
  font-variant-numeric:tabular-nums;
}

.plan-table th,.plan-table td{
  border-top:1px solid #ececec;
  padding:8px;
  text-align:left;
  vertical-align:top;
}

.plan-table thead th{
  background:#f9fafb;
  white-space:nowrap;
}

.plan-table thead th.done-week{
  background:#111827;
  color:#ffffff;
}

.exercise-name{
  position:sticky;
  left:0;
  background:#ffffff;
  min-width:130px;
  max-width:150px;
  font-weight:600;
  z-index:1;
}

.plan-table thead .exercise-name{
  background:#f9fafb;
}

.day-row th{
  background:#f3f4f6;
  font-weight:700;
}

.cell{
  min-width:92px;
}

.planned{
  color:#6b7280;
  font-size:10px;
  margin-top:2px;
}

.status-hit{
  background:#ecfdf5;
}

.status-close{
  background:#fef3c7;
}

.status-big{
  background:#fee2e2;
}

.status-low{
  background:#ede9fe;
}

.changed{
  box-shadow:inset 0 0 0 2px #2563eb;
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px 16px;
}

.legend span{
  display:inline-flex;
  align-items:center;
  gap:6px;
}

.swatch{
  width:14px;
  height:14px;
  border-radius:4px;
  border:1px solid #e5e7eb;
  display:inline-block;
}

.why{
  border-left:4px solid #d1d5db;
  padding:4px 0 4px 12px;
}

.status-border-close{
  border-color:#f59e0b;
}

.status-border-big{
  border-color:#ef4444;
}

.status-border-low{
  border-color:#8b5cf6;
}

.status-border-hit{
  border-color:#10b981;
}

</style>
</head>

<body>

<section class="hero text-white">

  <nav class="max-w-7xl mx-auto px-5 py-6 flex justify-between items-center gap-4">

    <a href="index.html" class="font-extrabold tracking-wide">
      BRUNO ZGELA COACHING
    </a>

  </nav>

  <div class="max-w-5xl mx-auto px-5 pt-4 pb-10">

    <span class="text-red-400 font-semibold">TEST PAGE</span>

    <h1 class="text-4xl sm:text-5xl font-extrabold mt-3">Adaptive progression test</h1>

    <p class="text-gray-300 mt-4 max-w-2xl">
      Log a week, miss some targets, and watch the rest of the 12 weeks change.
      This is only saved in this browser and does not touch member accounts.
    </p>

  </div>

</section>

<main id="test-app" class="max-w-5xl mx-auto px-5 py-8" aria-live="polite">
  <p class="text-gray-500 text-center">Loading...</p>
</main>

<script src="challenge-test.js?v=4"></script>

</body>
</html>
