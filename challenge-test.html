<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">

<script>
// Runs before the page draws, so dark mode does not flash white first
(function () {
  let saved = null;
  try { saved = localStorage.getItem('challengeTheme'); } catch (error) { /* Storage can be blocked */ }
  const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>

<title>Challenge Test | Bruno Zgela Coaching</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="challenge-test-rules.js?v=25"></script>

<style>

body{
  font-family:'Inter',sans-serif;
  background:#f5f5f5;
  color:#111827;
}

.hero{
  background:
    linear-gradient(to bottom,rgba(0,0,0,0.78),rgba(0,0,0,0.92)),
    url('folder/img1.jpeg');
  background-size:cover;
  background-position:center;
}

.btn-primary{
  background:#ef4444;
  color:#ffffff;
  font-weight:600;
  min-height:52px;
  padding:12px 22px;
  border-radius:12px;
  transition:.25s ease;
}

.btn-primary:hover{
  background:#dc2626;
}

.btn-outline{
  border:1px solid #d1d5db;
  background:#ffffff;
  font-weight:500;
  min-height:52px;
  padding:12px 18px;
  border-radius:12px;
}

.btn-outline:hover{
  background:#f3f4f6;
}

.btn-secondary{
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.05);
  transition:.25s ease;
}

.btn-secondary:hover{
  background:rgba(255,255,255,0.12);
}

.card{
  background:#ffffff;
  border-radius:18px;
  border:1px solid #ececec;
  padding:20px;
  min-width:0;
}

.card-flush{
  padding:0;
  overflow:hidden;
}

/* Keeps the wide plan table scrolling inside its card */
#test-app .grid{
  grid-template-columns:minmax(0,1fr);
}

.tools-summary{
  min-height:44px;
  display:flex;
  align-items:center;
  font-weight:600;
  cursor:pointer;
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.scenario-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}

.scenario{
  text-align:left;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:14px;
  background:#ffffff;
}

.scenario:hover,.scenario.active{
  border-color:#ef4444;
}

.scenario.active{
  box-shadow:inset 0 0 0 1px #ef4444;
}

.checkin-label{
  font-size:14px;
  font-weight:500;
  margin-bottom:8px;
}

.checkin-row{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:8px;
}

.checkin-button{
  min-height:48px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#ffffff;
  font-size:17px;
  font-weight:600;
}

.checkin-button.active{
  background:#111827;
  border-color:#111827;
  color:#ffffff;
}

.day-tabs{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  scroll-margin-top:8px;
}

.day-tab{
  min-height:52px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#ffffff;
  font-weight:600;
}

.day-tab.active{
  background:#111827;
  border-color:#111827;
  color:#ffffff;
}

.action-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}

.message{
  background:#fef2f2;
  border:1px solid #fecaca;
  border-radius:12px;
  padding:12px 16px;
}

.tab-row{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}

.tab{
  min-height:52px;
  padding:8px 6px;
  border:1px solid #e5e7eb;
  border-radius:12px;
  background:#ffffff;
  font-weight:600;
}

.tab.active{
  background:#ef4444;
  border-color:#ef4444;
  color:#ffffff;
}

.exercise-list{
  display:grid;
  gap:12px;
}

.exercise{
  background:#e5e7eb;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:14px;
}

.exercise-head{
  text-align:center;
  padding-bottom:12px;
  border-bottom:1px solid #c4c9d1;
}

.exercise-title{
  font-size:19px;
  line-height:1.3;
  font-weight:700;
  color:#111827;
}

.target{
  font-size:18px;
  line-height:1.35;
  color:#b91c1c;
  font-weight:700;
}

.exercise-info{
  font-size:15px;
  line-height:1.4;
  color:#1f2937;
  font-weight:500;
}

.tag{
  font-size:12px;
  font-weight:600;
  border-radius:999px;
  padding:2px 10px;
}

.tag-lighter{
  background:#ede9fe;
  color:#5b21b6;
}

.tag-rebuilt{
  background:#dbeafe;
  color:#1e40af;
}

.set-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
  gap:12px;
}

.set-label{
  display:block;
  font-size:13px;
  color:#374151;
  margin-bottom:4px;
}

.stepper{
  display:grid;
  grid-template-columns:44px minmax(0,1fr) 44px;
  gap:4px;
}

.step{
  height:48px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#ffffff;
  font-size:22px;
  font-weight:600;
  line-height:1;
  touch-action:manipulation;
}

.step:active{
  background:#e5e7eb;
}

.set-input{
  width:100%;
  min-width:0;
  height:48px;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:0;
  text-align:center;
  color:#111827;
  font-size:17px;
  font-weight:600;
  -moz-appearance:textfield;
}

.set-input::-webkit-outer-spin-button,.set-input::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}

.easy-row{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:52px;
  padding:8px 14px;
  background:#ffffff;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-weight:500;
  cursor:pointer;
}

.easy-row:has(input:checked){
  border-color:#ef4444;
  background:#fef2f2;
}

.easy-box{
  width:24px;
  height:24px;
  flex:none;
  accent-color:#ef4444;
}

.set-input:focus,.step:focus-visible,.checkin-button:focus-visible,.day-tab:focus-visible,.tab:focus-visible,.scenario:focus-visible,.btn-primary:focus-visible,.btn-outline:focus-visible{
  outline:none;
  box-shadow:0 0 0 2px #ef4444;
}

@media (max-width:480px){
  .card{
    padding:14px;
  }

  .card-flush{
    padding:0;
  }

  .exercise{
    padding:12px;
  }

  .exercise-name{
    min-width:96px;
    max-width:110px;
  }
}

.table-wrap{
  overflow-x:auto;
  margin-top:12px;
}

.plan-table{
  border-collapse:collapse;
  font-size:12px;
  font-variant-numeric:tabular-nums;
}

.plan-table th,.plan-table td{
  border-top:1px solid #ececec;
  padding:8px;
  text-align:left;
  vertical-align:top;
}

.plan-table thead th{
  background:#f9fafb;
  white-space:nowrap;
}

.plan-table thead th.done-week{
  background:#111827;
  color:#ffffff;
}

.exercise-name{
  position:sticky;
  left:0;
  background:#ffffff;
  min-width:130px;
  max-width:150px;
  font-weight:600;
  z-index:1;
}

.plan-table thead .exercise-name{
  background:#f9fafb;
}

.day-row th{
  background:#f3f4f6;
  font-weight:700;
}

.day-label{
  position:sticky;
  left:8px;
}

.cell{
  min-width:92px;
}

.planned{
  color:#6b7280;
  font-size:10px;
  margin-top:2px;
}

.status-hit{
  background:#ecfdf5;
}

.status-close{
  background:#fef3c7;
}

.status-big{
  background:#fee2e2;
}

.status-low{
  background:#ede9fe;
}

.changed{
  box-shadow:inset 0 0 0 2px #2563eb;
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px 16px;
}

.legend span{
  display:inline-flex;
  align-items:center;
  gap:6px;
}

.swatch{
  width:14px;
  height:14px;
  border-radius:4px;
  border:1px solid #e5e7eb;
  display:inline-block;
}

.why{
  border-left:4px solid #d1d5db;
  padding:4px 0 4px 12px;
}

.status-border-close{
  border-color:#f59e0b;
}

.status-border-big{
  border-color:#ef4444;
}

.status-border-low{
  border-color:#8b5cf6;
}

.status-border-hit{
  border-color:#10b981;
}

.theme-toggle{
  min-height:44px;
  padding:8px 16px;
  border-radius:12px;
  font-weight:500;
  white-space:nowrap;
}

/* Workout overview */
.plan-list{
  display:grid;
  gap:8px;
  list-style:none;
  padding:0;
  margin:0;
}

.plan-block{
  margin-top:6px;
  font-size:0.8rem;
  font-weight:700;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:#6b7280;
}

html[data-theme="dark"] .plan-block{
  color:#9ca3af;
}

.player-block{
  font-size:0.8rem;
  font-weight:700;
  letter-spacing:0.04em;
  text-transform:uppercase;
  opacity:0.7;
  text-align:center;
}

.hold-clock{
  font-size:2rem;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}

.plan-row{
  padding:8px 12px;
  border-radius:12px;
  background:#e5e7eb;
  line-height:1.3;
}

.plan-row-name{
  font-weight:700;
  font-size:15px;
}

.plan-row-target{
  font-weight:700;
  font-size:15px;
  color:#b91c1c;
  font-variant-numeric:tabular-nums;
}

.plan-row-meta{
  font-size:13px;
  color:#374151;
}

html.has-plan .hero nav{
  padding-top:12px;
  padding-bottom:12px;
}
.done-note{
  text-align:center;
  font-weight:600;
  color:#047857;
  padding:12px;
}

.small-actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:4px 16px;
}

.link-button{
  min-height:44px;
  padding:0 4px;
  font-size:14px;
  color:#b91c1c;
  font-weight:500;
  text-decoration:underline;
}

html.has-plan .hero-body{
  display:none;
}

/* Guided workout: always one screen tall, nothing to scroll */
html.workout-open,
html.workout-open body{
  overflow:hidden;
}

.player{
  position:fixed;
  inset:0;
  z-index:60;
  display:flex;
  flex-direction:column;
  gap:12px;
  height:100dvh;
  background:#f5f5f5;
  padding:max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}

.player-scroll{
  overflow-y:auto;
}

.player-top{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:14px;
  font-weight:600;
}

.player-where{
  flex:1;
  min-width:0;
  color:#374151;
}

.total-clock{
  font-variant-numeric:tabular-nums;
  background:#e5e7eb;
  border-radius:999px;
  padding:4px 10px;
}

.player-exit{
  min-height:44px;
  padding:0 14px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#ffffff;
}

/* The slot takes whatever height is left; the video inside is always a square, as large as the slot allows */
.player-media{
  flex:1 1 auto;
  min-height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  container-type:size;
}

.player-media video,
.player-media img{
  width:100%;
  height:100%;
  max-width:100%;
  max-height:100%;
  width:min(100cqw, 100cqh);
  height:min(100cqw, 100cqh);
  aspect-ratio:1 / 1;
  object-fit:cover;
  border-radius:18px;
  background:#e5e7eb;
}

.media-empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  color:#4b5563;
  font-size:14px;
}

.media-icon{
  font-size:28px;
}

.player-main{
  text-align:center;
}

.player-name{
  font-size:20px;
  font-weight:700;
}

.player-count{
  font-size:15px;
  font-weight:600;
  color:#4b5563;
  margin-top:2px;
}

.player-target{
  font-size:clamp(36px, 11vw, 60px);
  font-weight:800;
  line-height:1.05;
  color:#b91c1c;
  margin-top:6px;
  font-variant-numeric:tabular-nums;
}

.player-sub{
  font-size:22px;
  font-weight:700;
  color:#b91c1c;
}

.player-meta{
  font-size:14px;
  color:#374151;
  margin-top:4px;
}

.player-button{
  width:100%;
  min-height:64px;
  font-size:20px;
}

.player-button:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

.player-rest{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-align:center;
}

.rest-label{
  font-size:16px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:#4b5563;
}

.rest-clock{
  font-size:clamp(56px, 20vw, 104px);
  font-weight:800;
  line-height:1;
  font-variant-numeric:tabular-nums;
}

.rest-status{
  font-size:16px;
  font-weight:600;
}

.player-rest[data-state="resting"] .rest-clock{ color:#111827; }
.player-rest[data-state="ready"] .rest-clock,
.player-rest[data-state="ready"] .rest-status{ color:#047857; }
.player-rest[data-state="late"] .rest-clock,
.player-rest[data-state="late"] .rest-status{ color:#b91c1c; }

.rest-bar{
  position:relative;
  width:100%;
  max-width:420px;
  height:10px;
  border-radius:999px;
  background:#e5e7eb;
  overflow:hidden;
  margin-top:6px;
}

.rest-fill{
  height:100%;
  width:0;
  background:#111827;
}

.rest-mark{
  position:absolute;
  top:0;
  bottom:0;
  width:3px;
  background:#047857;
}

.rest-window{
  font-size:13px;
  color:#4b5563;
}

.player-adjust{
  background:#e5e7eb;
  border-radius:16px;
  padding:10px 12px;
  text-align:center;
}

.adjust-title{
  font-size:14px;
  font-weight:600;
}

.adjust-row{
  display:flex;
  justify-content:center;
  gap:16px;
  margin-top:6px;
}

.adjust-slot{
  width:150px;
}

.adjust-label{
  font-size:12px;
  color:#374151;
  margin-bottom:2px;
}

.adjust-value{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ffffff;
}

.adjust-hint{
  font-size:12px;
  color:#4b5563;
  margin-top:4px;
}

.rest-warning{
  min-height:20px;
  margin-bottom:-6px;
  text-align:center;
  font-size:15px;
  font-weight:700;
  color:#b45309;
}

.player-button.is-early{
  background:#6b7280;
}

html[data-theme="dark"] .rest-warning{
  color:#fcd34d;
}

/* The Start button doubles as the rest bar */
.go-button{
  position:relative;
  overflow:hidden;
  border-radius:12px;
  background:#4b5563;
  color:#ffffff;
  font-weight:700;
}

/* The window between minimum and maximum rest, visible before the bar reaches it */
.go-zone{
  position:absolute;
  top:0;
  bottom:0;
  right:0;
  background:#6ee7b7;
  opacity:.55;
}

html[data-theme="dark"] .go-zone{
  background:#34d399;
  opacity:.35;
}
.go-fill{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:0;
  background:#dc2626;
  transition:width .25s linear, background-color .3s ease;
}

.go-fill.is-ready{
  background:#059669;
}

.go-mark{
  position:absolute;
  top:0;
  bottom:0;
  width:4px;
  margin-left:-2px;
  background:#ffffff;
  box-shadow:0 0 0 1px rgba(17,24,39,.35);
}

.go-label{
  position:relative;
  z-index:1;
  text-shadow:0 1px 2px rgba(0,0,0,.45);
}

.player > .player-name{
  text-align:center;
}
/* Clock-driven rounds (EMOM): the timer is always on screen */
.player-media-small{
  flex:1 1 0;
  min-height:48px;
}

.interval-clock-block{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  text-align:center;
}

.skip-button{
  width:100%;
  max-width:420px;
  margin-top:8px;
  min-height:48px;
  font-weight:600;
}

.skip-button:disabled{
  opacity:0.4;
}

.interval-bar{
  position:relative;
  width:100%;
  max-width:420px;
  height:12px;
  border-radius:999px;
  background:#d1d5db;
  overflow:hidden;
}

.interval-bar span{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:0;
  background:#059669;
  transition:width .25s linear;
}

html[data-theme="dark"] .interval-bar{
  background:#374151;
}

.resume-row{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:10px;
}
.player-next{
  font-size:14px;
  font-weight:600;
  text-align:center;
  color:#374151;
}

.player-review{
  display:grid;
  gap:18px;
  max-width:560px;
  width:100%;
  margin:0 auto;
  padding:12px 0;
}

.easy-chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.easy-chip{
  min-height:44px;
  padding:6px 12px;
  border:1px solid #d1d5db;
  border-radius:999px;
  background:#ffffff;
  font-size:14px;
}

.easy-chip.active{
  background:#fef2f2;
  border-color:#ef4444;
  color:#b91c1c;
  font-weight:600;
}

.player-confirm{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(17,24,39,.55);
}

.player-confirm .card{
  width:100%;
  max-width:360px;
}

@media (max-height:640px){
  .player{ gap:8px; }
  .player-media{ min-height:56px; }
  .rest-clock{ font-size:56px; }
  .player-button{ min-height:56px; }
}

/* Dark mode */
html[data-theme="dark"]{
  color-scheme:dark;
}

html[data-theme="dark"] body{
  background:#111318;
  color:#f3f4f6;
}

html[data-theme="dark"] .card{
  background:#1c1f26;
  border-color:#2d323c;
}

html[data-theme="dark"] .exercise{
  background:#2b2f38;
  border-color:#3d434f;
}

html[data-theme="dark"] .exercise-head{
  border-bottom-color:#4b5563;
}

html[data-theme="dark"] .exercise-title{
  color:#f9fafb;
}

html[data-theme="dark"] .target{
  color:#fca5a5;
}

html[data-theme="dark"] .exercise-info{
  color:#e5e7eb;
}

html[data-theme="dark"] .set-label,
html[data-theme="dark"] .text-gray-500,
html[data-theme="dark"] .text-gray-600,
html[data-theme="dark"] .text-gray-700{
  color:#d1d5db;
}

html[data-theme="dark"] .step,
html[data-theme="dark"] .set-input,
html[data-theme="dark"] .easy-row,
html[data-theme="dark"] .checkin-button,
html[data-theme="dark"] .day-tab,
html[data-theme="dark"] .tab,
html[data-theme="dark"] .scenario,
html[data-theme="dark"] .btn-outline{
  background:#1c1f26;
  border-color:#4b5563;
  color:#f3f4f6;
}

html[data-theme="dark"] .step:active,
html[data-theme="dark"] .btn-outline:hover{
  background:#3d434f;
